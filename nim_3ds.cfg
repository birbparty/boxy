# nim_3ds.cfg — Nintendo 3DS (devkitARM + citro3d)
# Copied to nim.cfg by scripts/build_3ds.sh so Nim auto-discovers it.
# Do NOT edit nim.cfg directly; edit this file.

# Selects the gcc toolchain family; arm.linux.gcc.* keys below specialize it to devkitARM.
cc = "gcc"
arm.linux.gcc.path      = "/opt/devkitpro/devkitARM/bin"
arm.linux.gcc.exe       = "arm-none-eabi-gcc"
arm.linux.gcc.linkerexe = "arm-none-eabi-gcc"

--os:linux
--cpu:arm

# Shady codegen (toPicaShbin) is used to assemble the PICA200 vertex shader at
# compile time (see src/boxy/backends/render2d_pica.nim). -d:shadyNoPixie keeps
# Shady's pixie-dependent CPU-sim runtime out of the ARM binary; the codegen
# needs no pixie. The Shady source path is supplied by scripts/build_3ds.sh.
--define:shadyNoPixie

# Architecture flags
# -mtp=soft is compile-only (software thread-pointer emulation); intentionally absent from --passL.
--passC:"-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft"
--passC:"-D__3DS__ -DARM11"
--passC:"-I/opt/devkitpro/libctru/include"
--passC:"-I/opt/devkitpro/citro3d/include"

# Linker — arch flags repeated so GCC selects the correct armv6k/fpu multilib
# and locates 3dsx_crt0.o via the specs startfile search.
--passL:"-specs=3dsx.specs -march=armv6k -mtune=mpcore -mfloat-abi=hard"
--passL:"-L/opt/devkitpro/libctru/lib -L/opt/devkitpro/citro3d/lib"
--passL:"-lcitro3d -lctru -lm"
# Nim injects -ldl for --os:linux targets; 3DS has no libdl.
# scripts/build_3ds.sh creates an empty libdl.a stub via arm-none-eabi-ar (GNU ar).
# -L. adds the current directory so the linker finds the stub.
--passL:"-L."
