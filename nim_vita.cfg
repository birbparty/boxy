# nim_vita.cfg — Sony PS Vita (VitaSDK + vitaGL)
#
# Copied to nim.cfg by scripts/build_vita.sh so Nim auto-discovers it. Do NOT edit
# nim.cfg directly — edit this file. The arm.linux.gcc.* keys are inert until an
# arm/linux target is selected, so the --cpu/--os lines below MUST stay or
# `nim c -d:vita` silently builds a host binary.
#
# boxy reaches the GPU through vitaGL (OpenGL ES over sceGxm). Unlike configy
# (graphics-free) this links the full vitaGL graphics chain.
#
# PREREQS (one-time):
#   1. VitaSDK installed at $VITASDK (default /usr/local/vitasdk); vdpm bootstrap.
#   2. vitaGL installed:  vdpm install vitaGL
#   3. The vita-aware opengl fork resolved by Nim. Easiest:
#        cd ~/git/opengl && nimble install -y     # birbparty/opengl @ 43ad61a
#      (adds `or defined(vita)` to opengl's static-link branch). Safe globally —
#      the change is additive and only fires under -d:vita.

cc = "gcc"
arm.linux.gcc.path      = "/usr/local/vitasdk/bin"
arm.linux.gcc.exe       = "arm-vita-eabi-gcc"
arm.linux.gcc.linkerexe = "arm-vita-eabi-gcc"

--cpu:arm
--os:linux
# arm-vita-eabi-gcc already defaults to armv7-a+neon/hard-float. Do NOT add the
# 3DS armv6k/mpcore flags here.

# Console runtime/memory profile (same set configy/raylib use on Vita).
--mm:arc
--threads:off
--define:useMalloc
--define:nimAllocPagesViaMalloc
--define:noSignalHandler
--opt:size

# MANDATORY: vita-elf-create consumes these retained relocations to emit SCE
# relocations. Without -Wl,-q the module data-aborts at a non-link load base on
# real hardware (Vita3K loads at the link base and HIDES this bug).
--passL:"-Wl,-q"

--passC:"-I/usr/local/vitasdk/arm-vita-eabi/include"
# TEMP (local dev): prefer our patched vitaGL fork over the sysroot lib. The patch
# allocates display color surfaces as dedicated CDRAM memblocks, which fixes the hardware
# black screen (sceDisplaySetFrameBuf rejects pool-suballocated buffers). Upstreaming via
# birbparty/vitaGL#1. Remove this -L once the patched libvitaGL.a is installed into the
# VitaSDK sysroot (e.g. `make NO_DEBUG=1 NO_SPLASHSCREEN=1 && sudo cp libvitaGL.a
# $VITASDK/arm-vita-eabi/lib/`). Build the fork first: (cd ~/git/vitaGL && make
# NO_DEBUG=1 NO_SPLASHSCREEN=1). The linker resolves -lvitaGL from the first -L that has
# it, so this MUST precede the sysroot -L.
--passL:"-L/Users/punk1290/git/vitaGL"
--passL:"-L/usr/local/vitasdk/arm-vita-eabi/lib"

# vitaGL graphics chain (installed via `vdpm install vitaGL`). vitaGL is C++, hence
# -lstdc++. Order matters: vitaGL before its Sce backend stubs.
--passL:"-lvitaGL"
--passL:"-lvitashark"
--passL:"-lSceShaccCgExt"
--passL:"-ltaihen_stub"
--passL:"-lSceShaccCg_stub"
--passL:"-lmathneon"

# Vita system stubs vitaGL needs. Start minimal; append on unresolved-symbol errors
# (boxy is graphics + libc only — it does NOT need the SDL2/audio/net/touch/motion
# stubs the raylib reference links).
--passL:"-lSceGxm_stub -lSceDisplay_stub -lSceCtrl_stub"
--passL:"-lSceKernelDmacMgr_stub -lSceSysmodule_stub -lSceCommonDialog_stub"
--passL:"-lSceAppMgr_stub -lScePower_stub"

# libc / Sce IO + the C++ runtime, grouped so GNU ld's single left-to-right pass
# resolves the mutual libc<->Sce stub references regardless of order.
--passL:"-Wl,--start-group -lc -lm -lstdc++ -lSceLibKernel_stub -lSceIofilemgr_stub -lSceProcessmgr_stub -Wl,--end-group"

# Nim injects -lrt for os:linux; Vita has no librt. scripts/build_vita.sh creates an
# empty librt.a stub in the build CWD; -L. puts it on the link path. (Vita ships a
# real libdl.a, so no libdl stub is needed — unlike 3DS.)
--passL:"-L."
